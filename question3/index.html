<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Card Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <img src="udhay.jpg" alt="Profile Picture" class="profile-img">
      <h2 class="name">John Doe</h2>
      <p class="bio">Web Developer based in XYZ.</p>
      <button class="cta-button">Contact Me</button>
    </div>
    <div class="card">
      <img src="udhay.jpg" alt="Profile Picture" class="profile-img">
      <h2 class="name">Jane Smith</h2>
      <p class="bio">Graphic Designer from AMAN BHALLA.</p>
      <button class="cta-button">Contact Me</button>
    </div>
    <div class="card">
      <img src="udhay.jpg" alt="Profile Picture" class="profile-img">
      <h2 class="name">Alice Johnson</h2>
      <p class="bio">Freelance Photographer.</p>
      <button class="cta-button">Contact Me</button>
    </div>
  </div>
</body>
</html>
